modLoader = "javafml"
loaderVersion = "[3,)"
license = "GPL-3.0-or-later"
issueTrackerURL = "https://github.com/WaterMediaTeam/watermedia/issues"

[[mods]]
modId = "watermedia_android_bridge"
version = "1.0.4"
displayName = "WATERMeDIA: Android Bridge"
authors = "WATERMeDIA Android Bridge contributors"
credits = "VideoLAN team for libVLC, SrRapero720 and Goedix for WATERMeDIA, PojavLauncher team for the Android JNA dispatch library"
description = '''
Android patch for WATERMeDIA: bundles libVLC built for Android and wires it into WATERMeDIA's
native discovery, so WATERFrAMES video screens and WATERMeDIA audio work on PojavLauncher and
other Android Java Edition launchers where no system VLC exists.

Targets Minecraft 1.21.1 / NeoForge 21.1.235+ / WATERMeDIA 2.1.36-2.1.37 (the VLC based
videolan4j generation; WATERMeDIA 3.x switched to an FFmpeg backend and is out of scope).

The bundled libvlc.so is the monolithic VLC-for-Android build (GPLv3/LGPLv2.1+), taken from
the official VLC for Android 3.7.1 release (https://get.videolan.org/vlc-android/3.7.1/).
Sources for VLC are available at https://code.videolan.org/videolan/vlc and
https://code.videolan.org/videolan/vlc-android.
'''

[[dependencies.watermedia_android_bridge]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.235,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.watermedia_android_bridge]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

# BEFORE makes NeoForge construct this mod first, so the bundled VLC is already
# in place when WATERMeDIA runs its own native discovery.
# The upper bound keeps the bridge away from WATERMeDIA 3.x, whose FFmpeg based
# player has neither videolan4j nor the discovery hook this patch builds on.
[[dependencies.watermedia_android_bridge]]
modId = "watermedia"
type = "required"
versionRange = "[2.1.36,3.0.0)"
ordering = "BEFORE"
side = "CLIENT"

# Optional rescue for WATERMeDIA's aligned native image allocations (see
# docs/TECHNICAL.md section 10).  The config is not "required", so a future
# WATERMeDIA that moves that call site only loses the fallback.
[[mixins]]
config = "watermedia_android_bridge.mixins.json"
